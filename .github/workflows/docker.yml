name: Docker build validation

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "Dockerfile.assembly"
      - "requirements.txt"
      - "plot_assembly"
      - "collect_assembly_metrics.py"
      - "out_lay"
      - "assembly_metrics_template.csv"
      - "tests/**"
      - "ASSEMBLY_DOCKER.md"
      - "hpc/**"
      - ".github/workflows/docker.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - "Dockerfile.assembly"
      - "requirements.txt"
      - "plot_assembly"
      - "out_lay"
      - "assembly_metrics_template.csv"
      - "tests/**"
      - "ASSEMBLY_DOCKER.md"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plotting-image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build plotting container
        run: docker build --tag al-genome-assembly:ci .
      - name: Check plotting CLI
        run: docker run --rm --user "$(id -u):$(id -g)" al-genome-assembly:ci --help
      - name: Test plots using synthetic metrics
        run: bash tests/smoke_test_plotting.sh al-genome-assembly:ci
      - name: Test QUAST/BUSCO metrics collector
        run: bash tests/smoke_test_metrics_collector.sh

  assembly-image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build MaSuRCA assembly container
        run: docker build -f Dockerfile.assembly --tag al-genome-assembly:assembly-ci .
      - name: Check MaSuRCA command is available
        run: docker run --rm --entrypoint micromamba al-genome-assembly:assembly-ci run -n base masurca --help
