name: Docker build validation

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "requirements.txt"
      - "plot_assembly"
      - "out_lay"
      - "assembly_metrics_template.csv"
      - ".github/workflows/docker.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - "requirements.txt"
      - "plot_assembly"
      - "out_lay"
      - "assembly_metrics_template.csv"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build container image
        run: docker build --tag al-genome-assembly:ci .
      - name: Check plotting CLI inside container
        run: docker run --rm al-genome-assembly:ci --help
